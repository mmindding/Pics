/* Layout: one quiet scroll of photos, chapter by chapter; the only words are the title and a note under each chapter's first frame. */
:root{
  --paper:#151716; --ink:#e7e9e6; --muted:#7f8480; --frame:#1d201f; color-scheme:dark;
  --scrim:rgba(14,15,15,.94); --on-scrim:#eef0ee;
  --display:"Gallery Serif","Gowun Batang",serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}

body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.7;-webkit-font-smoothing:antialiased}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:56px 80px}
h1{font-family:var(--display);font-weight:400;font-size:clamp(1.25rem,4.6vw,1.75rem);line-height:1.45;word-break:keep-all;margin:0 0 24px;text-wrap:balance}

.album{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin:0 0 24px}
.intro{font-family:var(--display);font-size:12.5px;line-height:1.85;color:var(--ink);margin:0 0 24px;max-width:34em;word-break:keep-all;display:grid;gap:12px}
.intro p{margin:0}
.outro{margin:32px 0 0}
.outro::before{content:"";display:block;width:32px;height:1px;background:var(--muted);opacity:.5;margin:0 auto 20px}
.tile{all:unset;cursor:pointer;display:grid;gap:8px;align-content:start;min-width:0}
.tile img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;background:var(--frame)}
.tile span{font-family:var(--body);font-size:12px;color:var(--muted);line-height:1.5;word-break:keep-all}
figcaption{word-break:keep-all}
figcaption .ln{display:block}
figcaption.fit{white-space:nowrap;text-wrap:nowrap;overflow:hidden;min-width:0}
.tile:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
@media (prefers-reduced-motion:no-preference){.tile img{transition:opacity .2s}.tile:hover img{opacity:.85}}
[hidden]{display:none!important}
section{scroll-margin-top:24px}
section+section{margin-top:32px}
section+section::before{content:"";display:block;width:32px;height:1px;background:var(--muted);opacity:.5;margin:0 auto 32px}
.grid{display:grid;gap:24px;grid-template-columns:minmax(0,1fr)}
figure{margin:0;display:grid;gap:8px;justify-self:center;width:fit-content;max-width:100%}
figure button{all:unset;cursor:zoom-in;display:block;background:var(--frame);line-height:0}
figure button:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
figure img{width:100%;height:auto;display:block;max-width:100%}
figcaption{font-family:var(--display);font-size:12.5px;color:var(--ink);line-height:1.85;text-wrap:balance}

.lb{position:fixed;inset:0;background:var(--scrim);z-index:50;display:grid;grid-template-rows:auto 1fr auto;color:var(--on-scrim);
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.lb-top,.lb-bot{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 16px}
.lb-top{justify-content:flex-end}
.lb-stage{display:grid;place-items:center;min-height:0;padding:0 8px}
.lb-stage img{max-width:100%;max-height:100%;object-fit:contain;user-select:none;-webkit-user-drag:none}
.lb-cap{font-family:var(--display);font-size:12.5px;min-height:1.5em;flex:1;min-width:0}
.lb button{all:unset;cursor:pointer;color:var(--on-scrim);padding:10px 14px;font-size:14px;border:1px solid rgba(238,240,238,.25)}
.lb button:hover{border-color:rgba(238,240,238,.7)}
.lb button:focus-visible{outline:2px solid var(--on-scrim);outline-offset:2px}
.lb-nav{display:flex;gap:8px;flex:none}
@media (prefers-reduced-motion:no-preference){figure img{transition:opacity .2s}figure button:hover img{opacity:.88}}

*,*::before,*::after{box-sizing:border-box}
body{margin:0}
img{max-width:100%}
</style>
</head>
<body>


<div class="wrap">
  <h1>내 시선의 끝에 닿은 것들</h1>
  <nav class="album" id="album" aria-label="대표 사진"></nav>
  <div class="intro"><p>시선의 끝을 모으면 취향이 보이지 않을까요?</p><p>돌아보니 8년 동안 카메라는 네 번 바뀌었지만, 제 눈이 머무는 곳은 늘 비슷했더라구요</p></div>
  <main id="chapters"></main>
  <div class="intro outro"><p>볕과 사람들 · 음악과 레코드 · 물가와 여름빛</p><p>제 시선이 유독 자주 머물렀던, 제 취향 모음집을 함께 즐겨 주셔서 감사합니다 :)</p></div>
</div>

<div class="lb" id="lb" hidden role="dialog" aria-modal="true" aria-label="사진 보기">
  <div class="lb-top"><button id="lb-close" aria-label="닫기">✕</button></div>
  <div class="lb-stage" id="lb-stage"><img id="lb-img" alt=""></div>
  <div class="lb-bot"><span class="lb-cap" id="lb-cap"></span>
    <span class="lb-nav"><button id="lb-prev" aria-label="이전 사진">←</button><button id="lb-next" aria-label="다음 사진">→</button></span></div>
</div>

<script>
const CHAPTERS=[
  {note:"첫 카메라는 스물한 살에 아빠가 물려주신 니콘 수동 필름카메라예요",fit:true,photos:[["1-01",1600,1200],["1-02",1380,1035,"카메라를 들고 떠났던 첫 여행, 러시아 횡단열차"],["1-04",1200,1600],["1-05",1600,1200]]},
  {note:"유럽 교환학생 시절엔 삼성 Kenox 자동 필름카메라를 애용했어요",photos:[["2-01",1188,891],["2-02",1200,1600],["2-06",1600,1199,"남프랑스 앙티브, 니스의 여름"],["2-03",1365,1024],["2-08",1600,1200,"아테네의 턱시도냥이와 몽골 게르 댕댕이"],["2-04",1544,1024,"그냥 지나칠 수 없는 방앗간"],["2-05",1600,1060],["2-07",542,360]]},
  {note:"필름 값이 비싸졌다는 핑계로...(!)\n일본 야후 경매에서 후지 빈티지 디카를 낙찰받았답니다",pos:"50% 30%",photos:[["3-01",751,1002],["3-02",1024,1365],["3-08",1024,1365],["3-03",907,1209,"유난히 짙은 녹음과"],["3-11",1544,1024,"푸른 바다를 지닌 이탈리아"],["3-04",911,1215],["3-09",811,1081,"좋아하는 에스프레소는 레몬을 곁들이는 로마노예요"],["3-05",480,360],["3-06",956,717,"우드 가구, 귀여운 식물들, 빼곡한 책과 LP"]]},
  {note:"마지막으로 올해 당근에서 니콘 디카를 데려왔어요",pos:"50% 40%",photos:[["4-01b",1200,1600],["4-21",1200,1600],["4-22",1200,1600],["4-23",1600,1200,"겨울이 끝나가던 9월의 호주"],["4-26",1600,1200,"표지와 장르만 보고 냅다 고르는 LP 디깅의 묘미"],["4-27",728,970],["4-25",1200,1600]]}
];
const all=[],main=document.getElementById("chapters"),album=document.getElementById("album");
CHAPTERS.forEach((c,ci)=>{
  const s=document.createElement("section"),g=document.createElement("div");g.className="grid";s.id="cam"+(ci+1);
  c.photos.forEach(([f,w,h,pc],pi)=>{
    const cap=pi===0?c.note:(pc||""),i=all.length;all.push({src:`${f}.jpg`,cap:cap.replace(/\n/g," ")});
    const fig=document.createElement("figure"),bt=document.createElement("button"),im=document.createElement("img");
    fig.style.width=`min(100%, calc(560px * ${(w/h).toFixed(4)}))`;
    bt.setAttribute("aria-label","사진 크게 보기");
    im.src=`${f}.jpg`;im.width=w;im.height=h;im.loading=i<4?"eager":"lazy";im.decoding="async";im.alt=cap;
    bt.appendChild(im);bt.addEventListener("click",()=>open(i));fig.appendChild(bt);
    if(cap){const fc=document.createElement("figcaption");cap.split("\n").forEach(t=>{const l=document.createElement("span");l.className="ln";l.textContent=t;fc.appendChild(l)});if(pi===0&&c.fit)fc.className="fit";fig.appendChild(fc)}
    g.appendChild(fig);
  });
  s.appendChild(g);main.appendChild(s);
});
const ALBUM=Array.from({length:12},(_,k)=>({src:`a${String(k+1).padStart(2,"0")}.jpg`,cap:""}));
ALBUM.forEach((p,k)=>{
  const t=document.createElement("button");t.className="tile";t.setAttribute("aria-label","사진 크게 보기");
  const ti=document.createElement("img");ti.src=p.src;ti.alt="";ti.decoding="async";
  t.append(ti);t.addEventListener("click",()=>open(k,ALBUM));album.appendChild(t);
});
const lb=document.getElementById("lb"),lbImg=document.getElementById("lb-img"),lbCap=document.getElementById("lb-cap");
let cur=0,lastFocus=null,set=all;
function show(i){cur=(i+set.length)%set.length;const p=set[cur];lbImg.src=p.src;lbImg.alt=p.cap;lbCap.textContent=p.cap}
function open(i,s){set=s||all;lastFocus=document.activeElement;show(i);lb.hidden=false;document.body.style.overflow="hidden";document.getElementById("lb-close").focus()}
function close(){lb.hidden=true;document.body.style.overflow="";lastFocus&&lastFocus.focus()}
document.getElementById("lb-close").onclick=close;
document.getElementById("lb-prev").onclick=()=>show(cur-1);
document.getElementById("lb-next").onclick=()=>show(cur+1);
document.getElementById("lb-stage").addEventListener("click",e=>{if(e.target.id==="lb-stage")close()});
addEventListener("keydown",e=>{if(lb.hidden)return;if(e.key==="Escape")close();if(e.key==="ArrowLeft")show(cur-1);if(e.key==="ArrowRight")show(cur+1)});
let sx=null;lb.addEventListener("touchstart",e=>{sx=e.touches[0].clientX},{passive:true});
lb.addEventListener("touchend",e=>{if(sx===null)return;const dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>40)show(cur+(dx<0?1:-1));sx=null});
function fitCaps(){document.querySelectorAll("figcaption.fit").forEach(f=>{f.style.fontSize="";let need=0;f.querySelectorAll(".ln").forEach(l=>{const s=document.createElement("span");s.style.cssText="position:absolute;visibility:hidden;white-space:nowrap;font:inherit";s.textContent=l.textContent;f.appendChild(s);need=Math.max(need,s.getBoundingClientRect().width);s.remove()});const have=f.clientWidth;if(need>have){f.style.fontSize=(parseFloat(getComputedStyle(f).fontSize)*have/need*0.98)+"px"}})}

fitCaps();addEventListener("resize",fitCaps);document.fonts&&document.fonts.ready.then(fitCaps);
</script>

</body>
</html>
