html,body{margin:0;height:100%;background:#151716;overflow:hidden}
.stage{position:fixed;top:0;left:0;right:0;bottom:0;display:-webkit-box;display:flex;-webkit-box-orient:vertical;flex-direction:column;padding:4px 0}
.row{-webkit-box-flex:1;flex:1;min-height:0;overflow:hidden;margin:4px 0;position:relative}
.track{position:absolute;top:0;left:0;height:100%;white-space:nowrap;-webkit-animation:slide linear infinite;animation:slide linear infinite}
.rev .track{-webkit-animation-direction:reverse;animation-direction:reverse}
.track img{height:100%;width:auto;margin-right:8px;vertical-align:top}

.card{position:fixed;left:50%;top:50%;-webkit-transform:translate(-50%,-50%);transform:translate(-50%,-50%);background:#fafaf8;border-radius:24px;padding:4vmin;box-shadow:0 20px 60px rgba(0,0,0,.35);width:50vmin;text-align:center}
.card img{width:100%;height:auto;display:block;image-rendering:pixelated}
.card p{margin:2.4vmin 0 0;font:2.4vmin/1.5 "Cap",serif;color:#5f6460}
